name: Release y-- Compiler

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git libx11-dev libxtst-dev
      - name: Build Linux binary
        run: |
          mkdir -p build_cmake
          cd build_cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --parallel $(nproc)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: y_lang_linux
          path: |
            build/release/ymm
            build/release/libylang_core.so

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-nlohmann-json

      - name: Build Windows binary
        run: |
          mkdir build_cmake
          cd build_cmake
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: y_lang_windows
          path: build/release/ymm.exe

  build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git libx11-dev libxtst-dev

      - name: Build ARM binary
        run: |
          mkdir -p build_cmake
          cd build_cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --parallel $(nproc)

      - name: Upload ARM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: y_lang_arm
          path: |
            build/release/ymm
            build/release/libylang_core.so

  release:
    needs: [build-linux, build-windows, build-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: y_lang_linux
          path: release-binaries/linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: y_lang_windows
          path: release-binaries/windows

      - name: Download ARM Artifact
        uses: actions/download-artifact@v4
        with:
          name: y_lang_arm
          path: release-binaries/arm

      - name: Prepare binaries
        run: |
          mkdir -p final-release
          tar -czf final-release/y_lang_linux.tar.gz -C release-binaries/linux ymm libylang_core.so
          
          # Windows executable might be in a nested Release folder if Ninja wasn't used, but we use Ninja. Let's just find and move safely.
          find release-binaries/windows -name "*.exe" -exec mv {} final-release/y_lang_windows.exe \; || true
          
          tar -czf final-release/y_lang_arm.tar.gz -C release-binaries/arm ymm libylang_core.so
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || 'Latest' }}
          generate_release_notes: true
